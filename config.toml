#:schema /run/current-system/sw/share/alt/config.schema.json
# Example configuration; ~/.config/alt/config.toml. The first line makes taplo, and so helix,
# validate and complete this file against `alt schema`.
# Keys are W3C KeyboardEvent.code names in snake_case, letters and digits by character; modifiers
# are ctrl, alt, shift and super. An action is "namespace.verb", or { namespace.verb = argument }.

[input.pointer]
natural_scroll = false

[display]
sync_brightness = true

[bindsym]
f1 = { keyboard.press = "dictation" }
f4 = { exec = "open -a 'Mission Control'" }
f6 = "media.mute"
f7 = "media.volume_down"
f8 = "media.volume_up"
f9 = "display.brightness_down"
f10 = "display.brightness_up"
"ctrl+t" = { keyboard.type = "✓" }
home = { app.focus = "org.nixos.firefox" }
end = { app.focus = "com.mitchellh.ghostty" }
"alt+b" = { bluetooth.toggle = "f8-8f-07-40-54-34" }
"super+home" = { window.resize = { width = 100 } }
"super+end" = { window.resize = { width = -100 } }
"ctrl+alt+arrow_left" = { window.tile = "left" }
"ctrl+alt+arrow_right" = { window.tile = "right" }
"ctrl+alt+arrow_up" = "window.fullscreen"
"ctrl+alt+arrow_down" = { window.display = "next" }
"ctrl+alt+shift+arrow_left" = { window.tile = "top_left" }
"ctrl+alt+shift+arrow_right" = { window.tile = "bottom_right" }
"ctrl+alt+enter" = "window.fill"
"ctrl+alt+c" = "window.center"

[app_id."org.nixos.firefox"]
on_launch = "window.fullscreen"

[app_id."org.nixos.firefox".bindsym]
page_up = { keyboard.press = "ctrl+shift+tab" }
page_down = { keyboard.press = "ctrl+tab" }
backquote = { keyboard.press = "ctrl+z" }
"ctrl+backquote" = { keyboard.press = "ctrl+z" }
"super+home" = { window.resize = { width = -100 } }
"super+end" = { window.resize = { width = 100 } }

[app_id."com.apple.Music"]
on_launch = { app.kill = "com.apple.Music" }

[app_id."com.mitchellh.ghostty"]
on_launch = "window.fullscreen"
