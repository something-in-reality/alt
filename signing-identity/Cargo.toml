[package]
name = "signing-identity"
version = "0.1.0"
edition = "2024"
description = "A self-signed code-signing identity derived from a seed"
publish = false

[dependencies]
anyhow = "1"
blake3 = { version = "1.8", features = ["zeroize"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
x509-cert = { version = "0.3", features = ["builder", "pem"] }
zeroize = "1"
