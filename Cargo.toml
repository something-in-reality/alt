[package]
name = "alt"
version = "0.18.0"
edition = "2024"
description = "Keyboard, pointer, window and display behaviour outside the terminal"
publish = false

# The macOS app bundle; the identifier names its permissions and log subsystem.
[package.metadata.bundle]
identifier = "something-in-reality.alt"
# Where the nix-darwin module installs the signed app.
path = "/Applications/Alt.app"

[workspace]
members = ["signing-identity"]

[dependencies]
anyhow = "1"
arc-swap = "1.9"
bitflags = "2.9"
clap = { version = "4.6", features = ["derive"] }
derive_more = { version = "2", features = ["as_ref", "display", "from"] }
edit = { version = "0.1", features = ["quoted-env"] }
inquire = "0.9"
jiff = "0.2"
keycode = "1"
notify-debouncer-full = "0.7"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde-untagged = "0.1.9"
serde_json = "1"
serde_with = "3.24"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xdg = "3"

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
toml = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
ddc = "0.2"
ddc-macos = "0.2"
dispatch2 = "0.3"
libloading = "0.8"
libproc = "0.14"
num_enum = "0.7"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationSettings", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
tracing-oslog = "0.3"
